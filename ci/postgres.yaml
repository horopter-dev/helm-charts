---
apiVersion: v1
kind: Secret
metadata:
  name: horopter-db-app
stringData:
  uri: postgres://horopter:horopter@postgres:5432/horopter?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - {name: POSTGRES_USER, value: horopter}
            - {name: POSTGRES_PASSWORD, value: horopter}
            - {name: POSTGRES_DB, value: horopter}
          readinessProbe:
            exec:
              command: [pg_isready, -U, horopter]
