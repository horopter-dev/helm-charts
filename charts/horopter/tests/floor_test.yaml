---
suite: the image tag floor
templates:
  - templates/deployment.yaml
release:
  name: hp
set:
  database.existingSecret: db
tests:
  - it: refuses v0.1.0
    set:
      image.tag: v0.1.0
    asserts:
      - failedTemplate:
          errorPattern: "image.tag must be v0.2.0 or later"

  - it: refuses a prerelease below the floor
    set:
      image.tag: v0.1.0-dev.3
    asserts:
      - failedTemplate:
          errorPattern: "image.tag must be v0.2.0 or later"

  - it: refuses a prerelease of the floor itself
    set:
      image.tag: v0.2.0-rc.1
    asserts:
      - failedTemplate:
          errorPattern: "image.tag must be v0.2.0 or later"

  - it: accepts the floor itself
    set:
      image.tag: v0.2.0
    asserts:
      - notFailedTemplate: {}

  - it: accepts a prerelease above the floor
    set:
      image.tag: v0.3.0-dev.1
    asserts:
      - notFailedTemplate: {}

  - it: accepts a tag without the v prefix
    set:
      image.tag: 0.2.1
    asserts:
      - notFailedTemplate: {}

  - it: does not judge a digest
    set:
      image.tag: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - notFailedTemplate: {}

  - it: does not judge a non-semver tag
    set:
      image.tag: edge
    asserts:
      - notFailedTemplate: {}

  - it: applies the floor to the appVersion fallback
    chart:
      appVersion: v0.1.0
    asserts:
      - failedTemplate:
          errorPattern: "image.tag must be v0.2.0 or later"

  # The no-v test above uses 0.2.1, which passes whether or not the prefix is optional.
  - it: refuses a tag below the floor without the v prefix
    set:
      image.tag: 0.1.0
    asserts:
      - failedTemplate:
          errorPattern: "image.tag must be v0.2.0 or later"
