{{- include "horopter.checkExposure" . }}
{{- if .Values.egress.kubernetesIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "horopter.fullname" . }}-egress
  labels:
    {{- include "horopter.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress
spec:
  {{- with .Values.egress.kubernetesIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.egress.kubernetesIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "horopter: egress.kubernetesIngress.host is required" .Values.egress.kubernetesIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "horopter.fullname" . }}-egress
                port:
                  number: {{ .Values.egress.port }}
{{- end }}
