{{- include "horopter.checkExposure" . }}
{{- range $name := list "ingress" "egress" }}
{{- $d := index $.Values $name }}
{{- if $d.kubernetesIngress.enabled }}
{{- $service := include "horopter.componentName" (dict "ctx" $ "component" $name) }}
{{- $missingHost := printf "horopter: %s.kubernetesIngress.host is required" $name }}
{{- $host := required $missingHost $d.kubernetesIngress.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $service }}
  labels:
    {{- include "horopter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- with $d.kubernetesIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $d.kubernetesIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: {{ $d.port }}
{{- end }}
{{- end }}
