{{- include "horopter.checkExposure" . }}
{{- if .Values.egress.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "horopter.componentName" (dict "ctx" . "component" "egress") }}
  labels:
    {{- include "horopter.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress
spec:
  {{- if not .Values.egress.httpRoute.parentRefs }}
  {{- fail "horopter: egress.httpRoute.parentRefs is required — name the Gateway the route attaches to" }}
  {{- end }}
  parentRefs:
    {{- toYaml .Values.egress.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.egress.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "horopter.componentName" (dict "ctx" . "component" "egress") }}
          port: {{ .Values.egress.port }}
{{- end }}
