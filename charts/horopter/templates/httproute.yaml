{{- include "horopter.checkExposure" . }}
{{- range $name := list "ingress" "egress" }}
{{- $d := index $.Values $name }}
{{- if $d.httpRoute.enabled }}
{{- $service := include "horopter.componentName" (dict "ctx" $ "component" $name) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $service }}
  labels:
    {{- include "horopter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $d.httpRoute.parentRefs }}
  {{- fail (printf "horopter: %s.httpRoute.parentRefs is required — %s" $name
        "name the Gateway the route attaches to") }}
  {{- end }}
  parentRefs:
    {{- toYaml $d.httpRoute.parentRefs | nindent 4 }}
  {{- with $d.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $service }}
          port: {{ $d.port }}
{{- end }}
{{- end }}
