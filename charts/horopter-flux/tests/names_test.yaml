---
suite: names follow the release
templates:
  - templates/deployment.yaml
  - templates/rbac.yaml
  - templates/serviceaccount.yaml
release:
  name: hp
set:
  ingress.url: http://ingress:8080
  ingress.existingSecret: horopter-flux
tests:
  - it: renames the Deployment and its service account
    template: templates/deployment.yaml
    set:
      fullnameOverride: parent-fx
    asserts:
      - equal:
          path: metadata.name
          value: parent-fx
      - equal:
          path: spec.template.spec.serviceAccountName
          value: parent-fx

  - it: renames the role, the binding and its subject together
    template: templates/rbac.yaml
    set:
      fullnameOverride: parent-fx
    asserts:
      - equal:
          path: metadata.name
          value: parent-fx
      - equal:
          path: subjects[0].name
          value: parent-fx
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: parent-fx
        documentIndex: 1

  - it: keeps the release name alone when it already holds the chart name
    template: templates/serviceaccount.yaml
    release:
      name: horopter-flux
    asserts:
      - equal:
          path: metadata.name
          value: horopter-flux

  # Helm's longest release name, 53 characters, plus "-horopter-flux" is 67.
  - it: cuts names to 63 characters without a trailing hyphen
    template: templates/deployment.yaml
    release:
      name: a-release-name-long-enough-to-push-the-name-past-it-x
    asserts:
      - equal:
          path: metadata.name
          value: a-release-name-long-enough-to-push-the-name-past-it-x-horopter

  - it: labels pods with nameOverride, so the selector still matches
    template: templates/deployment.yaml
    set:
      nameOverride: fx
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: fx
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: fx
