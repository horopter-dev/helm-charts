---
name: Release

# Publishes a chart to oci://ghcr.io/horopter-dev/charts/<chart> when Release Please publishes
# a <chart>-<version> release (see release-please.yaml), for each chart under charts/.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install helm
        env:
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          sudo tar -xzf helm.tgz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          rm -f helm.tgz

      # A chart's name can hold a hyphen (horopter-flux), so the chart is the tag less its
      # trailing -<semver>, not the tag up to its first hyphen.
      - name: Refuse a tag that does not name a chart at its Chart.yaml version
        id: chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart="$(sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$//' <<< "$TAG")"
          if [ "$chart" = "$TAG" ] || [ ! -f "charts/$chart/Chart.yaml" ]; then
            echo "::error::tag $TAG names no chart under charts/"
            exit 1
          fi
          want="$chart-$(helm show chart "charts/$chart" | sed -n 's/^version: //p')"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match charts/$chart/Chart.yaml ($want)"
            exit 1
          fi
          echo "name=$chart" >> "$GITHUB_OUTPUT"

      - name: Package and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CHART: ${{ steps.chart.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          helm package "charts/$CHART"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$TAG.tgz" oci://ghcr.io/horopter-dev/charts
